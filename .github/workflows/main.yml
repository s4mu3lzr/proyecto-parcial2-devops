name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run API and E2E tests
        run: npm test

      - name: Report test execution to OpenObserve
        if: always()
        env:
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}/cicd_pipeline/_json
          OPENOBSERVE_AUTH: ${{ secrets.OPENOBSERVE_AUTH }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi

          jq -n \
            --arg event_type "test_execution" \
            --arg status "$STATUS" \
            --arg commit "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg actor "$ACTOR" \
            --arg repository "$REPOSITORY" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event_type: $event_type, status: $status, commit: $commit, branch: $branch, actor: $actor, repository: $repository, timestamp: $timestamp}' \
            | curl --fail-with-body --silent --show-error \
                --request POST "$OPENOBSERVE_URL" \
                --header "Authorization: Basic $OPENOBSERVE_AUTH" \
                --header "Content-Type: application/json" \
                --data-binary @-

  build-and-publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/inventario-devops:latest
            ${{ secrets.DOCKER_USERNAME }}/inventario-devops:${{ github.sha }}

  deploy-to-ec2:
    needs: build-and-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy container to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/inventario-devops:${{ github.sha }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OPENOBSERVE_URL }}
          OTEL_EXPORTER_OTLP_AUTH: ${{ secrets.OPENOBSERVE_AUTH }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PEM_KEY }}
          envs: DOCKER_IMAGE,OTEL_EXPORTER_OTLP_ENDPOINT,OTEL_EXPORTER_OTLP_AUTH
          script: |
            docker pull "$DOCKER_IMAGE"
            docker stop inventario-devops || true
            docker rm inventario-devops || true
            docker run -d \
              --name inventario-devops \
              --restart unless-stopped \
              -p 80:80 \
              -e OTEL_EXPORTER_OTLP_ENDPOINT="$OTEL_EXPORTER_OTLP_ENDPOINT" \
              -e OTEL_EXPORTER_OTLP_AUTH="$OTEL_EXPORTER_OTLP_AUTH" \
              "$DOCKER_IMAGE"

      - name: Report successful deployment to OpenObserve
        if: success()
        env:
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}/cicd_pipeline/_json
          OPENOBSERVE_AUTH: ${{ secrets.OPENOBSERVE_AUTH }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          jq -n \
            --arg event_type "deploy_ec2" \
            --arg status "success" \
            --arg commit "$COMMIT_SHA" \
            --arg branch "$BRANCH_NAME" \
            --arg actor "$ACTOR" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event_type: $event_type, status: $status, commit: $commit, branch: $branch, actor: $actor, timestamp: $timestamp}' \
            | curl --fail-with-body --silent --show-error \
                --request POST "$OPENOBSERVE_URL" \
                --header "Authorization: Basic $OPENOBSERVE_AUTH" \
                --header "Content-Type: application/json" \
                --data-binary @-
